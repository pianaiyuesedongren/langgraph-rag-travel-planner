[project]
name = "gaode-langgraph"
version = "2.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["backend/src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501"]
